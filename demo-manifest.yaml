# PostgreSQL ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: demo-orange
data:
  POSTGRES_DB: todoapp
  POSTGRES_USER: todouser
---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: demo-orange
type: Opaque
stringData:
  POSTGRES_PASSWORD: todopass
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: demo-orange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: demo-orange
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
# Spring Boot Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: demo-orange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: alaammari98/demo:todo-backend
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/todoapp"
        - name: SPRING_DATASOURCE_USERNAME
          value: "todouser"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "todopass"
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: demo-orange
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
# Angular Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: demo-orange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: alaammari98/demo:todo-frontend
        ports:
        - containerPort: 80
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: demo-orange
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
# Frontend Route (OpenShift)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend-route
  namespace: demo-orange
spec:
  to:
    kind: Service
    name: frontend-service
  port:
    targetPort: 80
---
# Backend Route (OpenShift)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend-route
  namespace: demo-orange
spec:
  to:
    kind: Service
    name: backend-service
  port:
    targetPort: 8080
  path: /api
